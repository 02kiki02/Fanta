name: Fanta Sync

on:
  schedule:
    # Ogni 6 ore (UTC) — adeguato a quotazioni + probabili
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fanta_updater
        env:
          # Opzionale: imposta repository variable SEASON (es. 2025-26)
          SEASON: ${{ vars.SEASON }}
        run: python fanta_updater.py --season "${SEASON:-2025-26}"

      - name: Commit & push DB se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantacalcio_db.json data/fantacalcio_db.csv
          if git diff --staged --quiet; then
            echo "Nessuna modifica al database."
          else
            git commit -m "chore(data): sync fantacalcio DB $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
